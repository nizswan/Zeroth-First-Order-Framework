[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroth-first-order"
version = "0.1.0"
description = "Taylor and Pade step selection around PyTorch optimizer updates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.9"]

[project.urls]
Repository = "https://github.com/nizswan/Zeroth-First-Order-Framework"
Documentation = "https://github.com/nizswan/Zeroth-First-Order-Framework/blob/main/wrapper/docs/library.md"
Issues = "https://github.com/nizswan/Zeroth-First-Order-Framework/issues"

[project.optional-dependencies]
bench = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29"]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["ZFO"]

[tool.pytest.ini_options]
testpaths = ["tests"]
