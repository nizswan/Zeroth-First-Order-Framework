name: Library checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            torch: '2.9.0'
          - python: '3.12'
            torch: '2.11.0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'torch==${{ matrix.torch }}' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,bench]' build
      - run: python -m pytest -q
      - run: python run.py --self_test
      - run: python examples/supervised.py
      - run: python examples/supervised.py --method pade3_21 --interior-search true
      - name: Build source distribution and wheel
        run: python -m build
      - name: Verify the installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/examples/supervised.py" --method pade3_21 --interior-search true
